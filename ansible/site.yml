---
- name: Configure Employee Management Application Servers
  hosts: app
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Apache
      apt:
        name: apache2
        state: present

    - name: Ensure Apache is running
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create application homepage
      shell: |
        HOSTNAME=$(hostname)
        cat > /var/www/html/index.html <<EOF
        <html>
        <head>
          <title>Employee Management System</title>
        </head>
        <body>
          <h1>Employee Management System</h1>
          <p>Server: $HOSTNAME</p>
          <p>Configured by Ansible.</p>
        </body>
        </html>
        EOF
